<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduSearch - Academic Research Portal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafbfc;--card:#ffffff;--text:#111827;--text2:#6b7280;--text3:#9ca3af;--accent:#4f46e5;--accent2:#6366f1;--border:#e5e7eb;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--shadow-lg:0 10px 40px rgba(0,0,0,.08)}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}

/* ===== HOME ===== */
#home{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
#home.hidden{display:none}

.grid-bg{position:absolute;inset:0;background-image:radial-gradient(circle,#d1d5db 1px,transparent 1px);background-size:28px 28px;opacity:.4;z-index:0}
.glow{position:absolute;width:600px;height:600px;border-radius:50%;filter:blur(120px);opacity:.08;z-index:0}
.glow-1{background:#4f46e5;top:-200px;right:-100px}
.glow-2{background:#6366f1;bottom:-200px;left:-100px}

.brand{text-align:center;margin-bottom:36px;z-index:1}
.brand h1{font-size:48px;font-weight:800;color:var(--text);letter-spacing:-1.5px}
.brand h1 span{color:var(--accent)}
.brand p{color:var(--text2);font-size:14px;margin-top:4px;letter-spacing:.3px;font-weight:500}

.search-wrap{width:min(620px,90vw);z-index:1}
.search-box{display:flex;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .2s,border-color .2s}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12),var(--shadow-lg)}
.search-box input{flex:1;padding:16px 22px;background:none;border:none;color:var(--text);font-size:16px;outline:none}
.search-box input::placeholder{color:var(--text3)}
.search-box button{padding:16px 28px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:15px;font-weight:600;transition:background .15s}
.search-box button:hover{background:var(--accent2)}

.shortcuts{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;justify-content:center;z-index:1}
.sc{padding:9px 16px;background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
.sc:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.sc .i{font-size:15px}

.footer{position:absolute;bottom:16px;color:var(--text3);font-size:10px;letter-spacing:1px;font-weight:600;z-index:1}

/* ===== BROWSER ===== */
#browser{height:100vh;display:none;flex-direction:column;background:#fff}
#browser.active{display:flex}

.toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--border);position:relative;z-index:50;flex-shrink:0}
.toolbar.hidden{display:none}

.tb{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
.tb:hover{border-color:var(--accent);color:var(--accent);background:#f0f0ff}
.tb.on{background:var(--accent);color:#fff;border-color:var(--accent)}

.url-bar{flex:1;padding:8px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s;min-width:0}
.url-bar:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(79,70,229,.1)}

.go{padding:8px 18px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:background .12s;flex-shrink:0}
.go:hover{background:var(--accent2)}

.frame-wrap{flex:1;position:relative;background:#fff;overflow:hidden}
.frame-wrap iframe{width:100%;height:100%;border:none;display:block}

.load-bar{position:absolute;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),#818cf8,var(--accent));width:0;z-index:10;border-radius:0 2px 2px 0;transition:width .3s}
.load-bar.go{animation:prog 2s ease-out forwards}
.load-bar.done{width:100%!important;opacity:0;transition:width .15s,opacity .3s .15s}
@keyframes prog{0%{width:0}50%{width:70%}100%{width:92%}}

/* ===== TABS ===== */
.tabbar{display:flex;align-items:center;background:#f0f1f3;border-bottom:1px solid var(--border);height:36px;overflow:hidden;flex-shrink:0}
.tabs-scroll{display:flex;align-items:center;flex:1;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs-scroll::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;padding:0 10px 0 14px;height:36px;min-width:100px;max-width:180px;background:#e2e3e7;border-right:1px solid var(--border);cursor:pointer;font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;flex-shrink:0;transition:background .12s;user-select:none}
.tab:hover{background:#d8d9de}
.tab.active{background:#fff;color:var(--text);border-bottom:1px solid #fff;margin-bottom:-1px;z-index:1}
.tab-title{flex:1;overflow:hidden;text-overflow:ellipsis}
.tab-x{width:16px;height:16px;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:11px;color:var(--text3);flex-shrink:0;transition:all .12s}
.tab-x:hover{background:rgba(0,0,0,.12);color:var(--text)}
.tab-new{width:32px;height:28px;margin:0 4px;background:none;border:none;border-radius:6px;cursor:pointer;font-size:18px;color:var(--text2);display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
.tab-new:hover{background:rgba(0,0,0,.08);color:var(--text)}

.fs-x{position:fixed;top:8px;right:8px;z-index:9999;padding:6px 14px;background:rgba(255,255,255,.95);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:12px;cursor:pointer;display:none;box-shadow:var(--shadow-lg);backdrop-filter:blur(8px);font-weight:500}
.fs-x:hover{color:var(--accent);border-color:var(--accent)}
.fs-x.show{display:block;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- HOME -->
<div id="home">
  <div class="grid-bg"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="brand">
    <h1>Edu<span>Search</span></h1>
    <p>Academic Research Portal</p>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <input type="text" id="q" placeholder="Search anything or enter a URL..." autofocus
             onkeydown="if(event.key==='Enter')homeGo()">
      <button onclick="homeGo()">Search</button>
    </div>
  </div>
  <div class="shortcuts">
    <div class="sc" onclick="go('google.com')"><span class="i">🔍</span>Google</div>
    <div class="sc" onclick="go('youtube.com')"><span class="i">▶</span>YouTube</div>
    <div class="sc" onclick="go('wikipedia.org')"><span class="i">📖</span>Wikipedia</div>
    <div class="sc" onclick="go('reddit.com')"><span class="i">💬</span>Reddit</div>
    <div class="sc" onclick="go('github.com')"><span class="i">⌨</span>GitHub</div>
    <div class="sc" onclick="go('discord.com/app')"><span class="i">🎧</span>Discord</div>
    <div class="sc" onclick="go('chat.openai.com')"><span class="i">🤖</span>ChatGPT</div>
    <div class="sc" onclick="go('spotify.com')"><span class="i">🎵</span>Spotify</div>
    <div class="sc" onclick="go('twitch.tv')"><span class="i">📺</span>Twitch</div>
    <div class="sc" onclick="go('tiktok.com')"><span class="i">🎬</span>TikTok</div>
  </div>
  <div class="footer">EDUSEARCH — ACADEMIC RESEARCH PORTAL</div>
</div>

<!-- BROWSER -->
<div id="browser">
  <div class="tabbar" id="tabbar">
    <div class="tabs-scroll" id="tabsScroll"></div>
    <button class="tab-new" onclick="newTab()" title="New tab">+</button>
  </div>
  <div class="toolbar" id="toolbar">
    <button class="tb" onclick="goHome()" title="Home">🏠</button>
    <button class="tb" onclick="goBack()" title="Back">←</button>
    <button class="tb" onclick="reload()" title="Reload">↻</button>
    <input type="text" class="url-bar" id="bar" placeholder="Search or enter URL..."
           onkeydown="if(event.key==='Enter')barGo()">
    <button class="go" onclick="barGo()">Go</button>
    <button class="tb" onclick="toggleFs()" id="fsbtn" title="Fullscreen">⛶</button>
  </div>
  <div class="frame-wrap">
    <div class="load-bar" id="loadbar"></div>
    <iframe id="frame"></iframe>
  </div>
</div>

<button class="fs-x" id="fsx" onclick="exitFs()">✕ Exit</button>

<script src="script.js"></script>
</body>
</html>
